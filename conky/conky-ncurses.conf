-- ~/.config/conky/conky-ncurses.conf
-- Terminal (ncurses) version of conky.conf.
--
-- Run with: conky-tui   (quit with q)
--
-- ncurses cannot draw conky's native bars, so every bar here is plain ASCII
-- produced by the usage helper. The box is centred in the terminal; conky-tui
-- passes the terminal size in CONKY_COLS/CONKY_LINES (falls back to 80x24).

-- Change these three lines to match your machine:
local NET     = 'wlp1s0f0' -- network interface (see: ip route | grep default)
local DISK    = '/'        -- mount point to watch
local DISKDEV = 'nvme0n1'  -- block device for I/O speed (see: lsblk)

-- Helper that samples usage and detects device names.
-- Install usage alongside this file as ~/.config/conky/usage.
local USAGE = os.getenv('HOME') .. '/.config/conky/usage'

conky.config = {
    -- ncurses backend: draw to the terminal instead of the desktop.
    out_to_x = false,
    out_to_wayland = false,
    out_to_ncurses = true,
    use_xft = false,

    update_interval = 1.0,

    default_color = 'white',

    -- ncurses only understands the eight basic colour names.
    color1 = 'white',  -- fg
    color2 = 'cyan',   -- labels
    color3 = 'magenta',-- npu
    color4 = 'red',    -- swap / write
    color5 = 'yellow', -- cpu
    color6 = 'green',  -- ram / up
    color7 = 'cyan',   -- gpu / down
    color9 = 'cyan',   -- disk

    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    uppercase = false,
    short_units = true,
}

-- Box geometry --------------------------------------------------------------
-- | CPU   <40-char bar>                    NNN% |
-- 0      8                                     49  54
local BOX_W     = 55   -- total width, borders included
local BOX_H     = 17   -- total height, borders included
local BAR_W     = 40   -- width of the ASCII bars
local COL_BAR   = 8    -- column where bars / values start
local COL_MID   = 30   -- column of the second half of I/O and NET rows
local COL_PCT   = 49   -- column of the right-aligned "NNN%" cell
local COL_RIGHT = 54   -- column of the right border

local cols = tonumber(os.getenv('CONKY_COLS') or '') or 80
local rows = tonumber(os.getenv('CONKY_LINES') or '') or 24
local pad_x = math.max(0, math.floor((cols - BOX_W) / 2))
local pad_y = math.max(0, math.floor((rows - BOX_H) / 2))

local function goto_(col)
    return '${goto ' .. (col + pad_x) .. '}'
end

-- Every line, borders included, is positioned at pad_x so the whole box is
-- centred as one block.
local function row(inner)
    return goto_(0) .. '${color2}|${color}' .. inner
        .. goto_(COL_RIGHT) .. '${color2}|${color}'
end

local function metric(label, colour, what)
    return row(' ${color2}' .. label .. '${color}  '
        .. '${color' .. colour .. '}${exec @USAGE@ bar ' .. what .. ' ' .. BAR_W .. '}${color}'
        .. goto_(COL_PCT) .. '${color' .. colour .. '}${exec @USAGE@ pct ' .. what .. '}%${color}')
end

local function header(label, colour, what)
    return row(' ${color2}' .. label .. '${color}  '
        .. '${color' .. colour .. '}${execi 3600 @USAGE@ name ' .. what .. '}${color}')
end

local function barline(colour, what)
    return row(goto_(COL_BAR) .. '${color' .. colour .. '}'
        .. '${exec @USAGE@ bar ' .. what .. ' ' .. BAR_W .. '}${color}'
        .. goto_(COL_PCT) .. '${color' .. colour .. '}${exec @USAGE@ pct ' .. what .. '}%${color}')
end

local function edge()
    return goto_(0) .. '${color2}+' .. string.rep('-', BOX_W - 2) .. '+${color}'
end

local text = table.concat({
    edge(),
    metric('CPU ', '5', 'cpu'),
    metric('RAM ', '6', 'ram'),
    metric('SWAP', '4', 'swap'),
    metric('DISK', '9', 'disk'),
    row(''),
    header('GPU ', '7', 'gpu'),
    barline('7', 'gpu'),
    row(''),
    header('NPU ', '3', 'npu'),
    barline('3', 'npu'),
    row(''),
    row(' ${color2}I/O ${color}  ${color2}R${color} ${color6}${diskio_read @DISKDEV@}${color}'
        .. goto_(COL_MID) .. '${color2}W${color} ${color4}${diskio_write @DISKDEV@}${color}'),
    row(''),
    row(' ${color2}NET ${color}  ${color2}up${color} ${color6}${upspeed @NET@}${color}'
        .. goto_(COL_MID) .. '${color2}down${color} ${color3}${downspeed @NET@}${color}'),
    row(goto_(COL_BAR) .. '${color6}${totalup @NET@}${color}'
        .. goto_(COL_MID) .. '${color3}${totaldown @NET@}${color}'),
    edge(),
}, '\n')

if pad_y > 0 then
    text = string.rep('\n', pad_y) .. text
end

conky.text = text:gsub('@NET@', NET):gsub('@DISK@', DISK):gsub('@DISKDEV@', DISKDEV)
    :gsub('@USAGE@', USAGE)
