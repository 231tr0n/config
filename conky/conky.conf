-- ~/.config/conky/conky.conf
-- Minimal system monitor using the Everforest (medium, dark) palette.
-- https://github.com/sainnhe/everforest

-- Change these three lines to match your machine:
local NET     = 'wlp1s0f0' -- network interface (see: ip route | grep default)
local DISK    = '/'        -- mount point to watch
local DISKDEV = 'nvme0n1'  -- block device for I/O speed (see: lsblk)

conky.config = {
    -- Centered, as a regular closable window. conky doubles gap_* under HiDPI
    -- (this display is 2880x1800 @ scale 2), so these gaps centre the window.
    -- Adjust if you change resolution/scale.
    alignment = 'top_left',
    gap_x = 570,
    gap_y = 239,

    background = false,
    border_width = 0,
    border_inner_margin = 14,
    border_outer_margin = 0,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    double_buffer = true,
    use_xft = true,

    font = 'Cascadia Code NF:size=10',
    default_color = '#d3c6aa',

    -- Everforest (medium, dark)
    color1 = '#d3c6aa', -- fg
    color2 = '#859289', -- grey1 (labels)
    color3 = '#4d5960', -- bg3
    color4 = '#e67e80', -- red   (swap)
    color5 = '#dbbc7f', -- yellow (cpu)
    color6 = '#a7c080', -- green (ram / up)
    color7 = '#7fbbb3', -- blue  (down)
    color9 = '#83c092', -- aqua  (disk)

    minimum_width = 250,
    maximum_width = 250,
    minimum_height = 5,

    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    update_interval = 1.0,
    uppercase = false,
    short_units = true,

    own_window = true,
    own_window_type = 'normal',
    -- Opaque background as a regular, closable window.
    own_window_transparent = false,
    own_window_argb_visual = false,
    own_window_colour = '#333c43',
    own_window_hints = 'skip_pager',
    own_window_title = 'conky-system',
}

conky.text = ([[
${color2}CPU${color}${goto 67}${voffset 1}${color5}${cpubar 6,145}${color1}${voffset -1}${alignr}${cpu}%

${color2}RAM${color}${goto 67}${voffset 1}${color6}${membar 6,145}${color1}${voffset -1}${alignr}${memperc}%

${color2}SWAP${color}${goto 67}${voffset 1}${color4}${swapbar 6,145}${color1}${voffset -1}${alignr}${swapperc}%

${color2}DISK${color}${goto 67}${voffset 1}${color9}${fs_bar 6,145 @DISK@}${color1}${voffset -1}${alignr}${fs_used_perc @DISK@}%

${color2}I/O${color}
${color2}R${color} ${color9}${diskio_read @DISKDEV@}${goto 210}${color2}W${color}${alignr}${color4}${diskio_write @DISKDEV@}

${color2}NET${color}
${color2}↑${color} ${color6}${upspeed @NET@}${goto 210}${color2}↓${color}${alignr}${color7}${downspeed @NET@}
${color2}↑${color} ${color6}${totalup @NET@}${goto 210}${color2}↓${color}${alignr}${color7}${totaldown @NET@}${color}
]]):gsub('@NET@', NET):gsub('@DISK@', DISK):gsub('@DISKDEV@', DISKDEV)
